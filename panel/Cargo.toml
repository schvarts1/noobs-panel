[package]
name = "panel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A simple Pterodactyl-like panel: users, admins, and resource limited web server instances."

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dependencies]
tiny_http = "0.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.6.0"
rand = "0.10.3"
libc = "0.2.191"
hello-server = { path = "../hello-server" }

[[bin]]
name = "noobs-panel"
path = "src/main.rs"
